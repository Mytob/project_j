services:
  hostmetrics:
    build:
      context: ../..
      dockerfile: deploy/hostmetrics/Dockerfile
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
      - type: bind
        source: /
        target: /host/root
        read_only: true
    expose:
      - "8181"

  totp-key-init:
    image: alpine:3.22
    user: "0:0"
    volumes:
      - totp_key:/key
    command: ["sh", "-c", "if [ ! -f /key/totp.key ]; then dd if=/dev/urandom of=/key/totp.key bs=32 count=1 2>/dev/null && chown 0:65532 /key/totp.key && chmod 440 /key/totp.key; fi"]

  wireguard-config-init:
    image: alpine:3.22
    user: "0:0"
    volumes:
      - ./wireguard.generated:/source:ro
      - wireguard_server:/server
      - wireguard_client:/client
    command: ["sh", "-c", "cp /source/server.conf /server/wg0.conf && chown 0:0 /server/wg0.conf && chmod 600 /server/wg0.conf && chmod 700 /server && cp /source/windows.conf /client/windows.conf && chown 0:65532 /client/windows.conf && chmod 640 /client/windows.conf && chown 0:65532 /client && chmod 750 /client"]

  wireguard:
    build:
      context: ../..
      dockerfile: deploy/wireguard/Dockerfile
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:${HTTP_PORT:-18080}:80"
      - "127.0.0.1:${HTTPS_PORT:-18443}:443"
    volumes:
      - wireguard_server:/etc/wireguard:ro
      - wireguard_health:/run/wireguard-health
    depends_on:
      wireguard-config-init:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - domain.test
          - admin.domain.test
          - access.domain.test
    restart: unless-stopped

  home-peer:
    build:
      context: ../..
      dockerfile: deploy/wireguard/Dockerfile
    cap_add:
      - NET_ADMIN
    volumes:
      - wireguard_client:/etc/wireguard:ro
    environment:
      WIREGUARD_CONFIG: /etc/wireguard/windows.conf
      WIREGUARD_INTERFACE: windows
    depends_on:
      wireguard:
        condition: service_healthy
    restart: unless-stopped

  home-jellyfin:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile.mock-jellyfin
    network_mode: service:home-peer
    depends_on:
      home-peer:
        condition: service_healthy

  wireguard-check:
    image: curlimages/curl:8.12.1
    network_mode: service:wireguard
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 600"]
    depends_on:
      wireguard:
        condition: service_healthy
      home-jellyfin:
        condition: service_started

  caddy:
    build:
      context: ../..
      dockerfile: deploy/caddy/Dockerfile
    network_mode: service:wireguard
    volumes:
      - ../../deploy/caddy/Caddyfile.test:/etc/caddy/Caddyfile:ro
      - ./whitelist.caddy.generated:/etc/caddy/whitelist.caddy:ro
      - caddy_admin_socket:/run/caddy-admin
      - ../../deploy/site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
      - proxy_metrics:/run/proxy-metrics
    depends_on:
      wireguard:
        condition: service_healthy
      caddy-socket-init:
        condition: service_completed_successfully
      proxy-metrics-init:
        condition: service_completed_successfully

  caddy-socket-init:
    image: alpine:3.22
    user: "0:0"
    volumes:
      - caddy_admin_socket:/run/caddy-admin
    command: ["sh", "-c", "chown 0:65532 /run/caddy-admin && chmod 2750 /run/caddy-admin"]

  proxy-metrics-init:
    image: alpine:3.22
    user: "0:0"
    volumes:
      - proxy_metrics:/run/proxy-metrics
    command: ["sh", "-c", "mkdir -p /run/proxy-metrics && chown 1000:1000 /run/proxy-metrics && chmod 0755 /run/proxy-metrics"]

  admin:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile.admin
      args:
        VERSION: integration-test
        BUILD_NUMBER: browser-test
    command: ["--listen", ":8080", "--config", "/opt/jellyfin-proxy/config/admin.json", "--totp-key", "/opt/jellyfin-proxy/config/totp-key/totp.key", "--totp-state", "/opt/jellyfin-proxy/data/totp-state.json", "--whitelist", "/opt/jellyfin-proxy/data/whitelist.json", "--caddy-socket", "/run/caddy-admin/admin.sock", "--caddyfile", "/etc/caddy/Caddyfile", "--wireguard-client-config", "/opt/jellyfin-proxy/config/wireguard/windows.conf", "--wireguard-health", "/run/wireguard-health/current", "--host-metrics-url", "http://hostmetrics:8181", "--proxy-metrics", "/run/proxy-metrics/current.json"]
    volumes:
      - ./admin-credential.generated.json:/opt/jellyfin-proxy/config/admin.json:ro
      - totp_key:/opt/jellyfin-proxy/config/totp-key:ro
      - wireguard_client:/opt/jellyfin-proxy/config/wireguard:ro
      - caddy_admin_socket:/run/caddy-admin
      - proxy_metrics:/run/proxy-metrics:ro
      - wireguard_health:/run/wireguard-health:ro
      - admin_data:/opt/jellyfin-proxy/data
      - ../../deploy/caddy/Caddyfile.test:/etc/caddy/Caddyfile:ro
    group_add:
      - "65532"
    expose:
      - "8080"
    depends_on:
      caddy:
        condition: service_started
      hostmetrics:
        condition: service_started
      admin-data-init:
        condition: service_completed_successfully
      totp-state-init:
        condition: service_completed_successfully
      totp-key-init:
        condition: service_completed_successfully
      wireguard-config-init:
        condition: service_completed_successfully

  browser-tests:
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    profiles: [browser-tests]
    working_dir: /tmp
    volumes:
      - ./browser:/tests:ro
    environment:
      BASE_URL: https://admin.domain.test
    command: ["bash", "-lc", "cp -a /tests /tmp/totp-browser && cd /tmp/totp-browser && npm ci && npx playwright test --reporter=line"]
    depends_on:
      admin:
        condition: service_started
    networks:
      default:
        ipv4_address: ${BROWSER_TEST_IP:-172.29.254.30}

  admin-data-init:
    image: alpine:3.22
    user: "0:0"
    volumes:
      - admin_data:/data
    command: ["sh", "-c", "chown 65532:65532 /data && chmod 700 /data"]

  totp-state-init:
    image: alpine:3.22
    user: "0:0"
    volumes:
      - admin_data:/data
    depends_on:
      admin-data-init:
        condition: service_completed_successfully
    command: ["sh", "-c", "if [ ! -f /data/totp-state.json ]; then printf '{\"version\":1,\"status\":\"unconfigured\"}\\n' > /data/totp-state.json && chown 65532:65532 /data/totp-state.json && chmod 600 /data/totp-state.json; fi"]

  trusted-client:
    image: curlimages/curl:8.12.1
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 600"]
    networks:
      default:
        ipv4_address: ${TRUSTED_CLIENT_IP:-172.29.254.10}

  untrusted-client:
    image: curlimages/curl:8.12.1
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 600"]
    networks:
      default:
        ipv4_address: ${UNTRUSTED_CLIENT_IP:-172.29.254.20}

volumes:
  wireguard_server:
  wireguard_client:
  caddy_data:
  caddy_config:
  caddy_admin_socket:
  admin_data:
  totp_key:
  proxy_metrics:
  wireguard_health:

networks:
  default:
    ipam:
      config:
        - subnet: ${TEST_SUBNET:-172.29.254.0/24}
