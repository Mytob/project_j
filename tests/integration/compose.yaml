services:
  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-18080}:80"
      - "127.0.0.1:${HTTPS_PORT:-18443}:443"
    volumes:
      - ../../deploy/caddy/Caddyfile.test:/etc/caddy/Caddyfile:ro
      - ./whitelist.caddy.generated:/etc/caddy/whitelist.caddy:ro
      - ../../deploy/site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      jellyfin-mock:
        condition: service_started
      trusted-client:
        condition: service_started
      untrusted-client:
        condition: service_started
      admin:
        condition: service_started

  admin:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile.admin
    command: ["--listen", ":8080", "--config", "/opt/jellyfin-proxy/config/admin.json"]
    volumes:
      - ./admin-credential.generated.json:/opt/jellyfin-proxy/config/admin.json:ro
    expose:
      - "8080"

  jellyfin-mock:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile.mock-jellyfin
    expose:
      - "8096"

  trusted-client:
    image: curlimages/curl:8.12.1
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 600"]
    networks:
      default:
        ipv4_address: ${TRUSTED_CLIENT_IP:-172.29.254.10}

  untrusted-client:
    image: curlimages/curl:8.12.1
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 600"]
    networks:
      default:
        ipv4_address: ${UNTRUSTED_CLIENT_IP:-172.29.254.20}

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    ipam:
      config:
        - subnet: ${TEST_SUBNET:-172.29.254.0/24}
