services:
  hostmetrics:
    build:
      context: ../..
      dockerfile: deploy/hostmetrics/Dockerfile
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
      - type: bind
        source: /
        target: /host/root
        read_only: true
    expose:
      - "8181"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8181/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    labels:
      jellyfin.proxy.role: application
    networks:
      default:
        ipv4_address: ${HOSTMETRICS_IP:-172.29.254.60}

  containerhealth:
    build:
      context: ../..
      dockerfile: deploy/containerhealth/Dockerfile
    read_only: true
    user: "0:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    expose:
      - "8282"
    networks:
      - observer
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8282/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  totp-key-init:
    network_mode: none
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    user: "0:0"
    volumes:
      - totp_key:/key
    command: ["sh", "-c", "if [ ! -f /key/totp.key ]; then dd if=/dev/urandom of=/key/totp.key bs=32 count=1 2>/dev/null && chown 0:65532 /key/totp.key && chmod 440 /key/totp.key; fi"]

  wireguard-config-init:
    network_mode: none
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    user: "0:0"
    volumes:
      - ./wireguard.generated:/source:ro
      - wireguard_server:/server
      - wireguard_client:/client
    command: ["sh", "-c", "mkdir -p /server /client && if [ ! -e /server/wg0.conf ]; then cp /source/server.conf /server/wg0.conf && chown 0:0 /server/wg0.conf && chmod 600 /server/wg0.conf; fi && chmod 700 /server && if [ ! -e /client/.initialized ]; then cp /source/windows.conf /client/windows.conf && chown 0:65532 /client/windows.conf && chmod 640 /client/windows.conf && touch /client/.initialized && chmod 600 /client/.initialized; fi && chown 0:65532 /client && chmod 2770 /client"]

  wireguard:
    build:
      context: ../..
      dockerfile: deploy/wireguard/Dockerfile
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:${HTTP_PORT:-18080}:80"
      - "127.0.0.1:${HTTPS_PORT:-18443}:443"
    environment:
      WIREGUARD_CONFIG: /etc/wireguard/wg0.conf
      WIREGUARD_CLIENT_CONFIG: /var/lib/wireguard-client/windows.conf
      WIREGUARD_CONTROL_SOCKET: /run/wireguard-control/control.sock
    volumes:
      - wireguard_server:/etc/wireguard:rw
      - wireguard_client:/var/lib/wireguard-client:rw
      - wireguard_control:/run/wireguard-control
      - wireguard_health:/run/wireguard-health
    depends_on:
      wireguard-config-init:
        condition: service_completed_successfully
    networks:
      default:
        ipv4_address: ${WIREGUARD_IP:-172.29.254.2}
        aliases:
          - domain.test
          - admin.domain.test
          - access.domain.test
    restart: unless-stopped
    labels:
      jellyfin.proxy.role: application

  home-peer:
    build:
      context: ../..
      dockerfile: deploy/wireguard/Dockerfile
    cap_add:
      - NET_ADMIN
    volumes:
      - wireguard_client:/etc/wireguard:ro
    environment:
      WIREGUARD_CONFIG: /etc/wireguard/windows.conf
      WIREGUARD_INTERFACE: windows
    depends_on:
      wireguard:
        condition: service_healthy
    networks:
      default:
        ipv4_address: ${HOME_PEER_IP:-172.29.254.70}
    restart: unless-stopped

  home-jellyfin:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile.mock-jellyfin
    network_mode: service:home-peer
    depends_on:
      home-peer:
        condition: service_healthy

  wireguard-check:
    image: curlimages/curl:8.23.0@sha256:a134550be58ab783810e613ae96fd253c38f7bdd16d9bf9be350700c7a29ac06
    network_mode: service:wireguard
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 600"]
    depends_on:
      wireguard:
        condition: service_healthy
      home-jellyfin:
        condition: service_started

  caddy:
    build:
      context: ../..
      dockerfile: deploy/caddy/Dockerfile
    network_mode: service:wireguard
    volumes:
      - ../../deploy/caddy/Caddyfile.test:/etc/caddy/Caddyfile:ro
      - ./whitelist.caddy.generated:/etc/caddy/whitelist.caddy:ro
      - caddy_admin_socket:/run/caddy-admin
      - ../../deploy/site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
      - proxy_metrics:/run/proxy-metrics
      - caddy_security_control:/run/caddy-security
    depends_on:
      wireguard:
        condition: service_healthy
      caddy-socket-init:
        condition: service_completed_successfully
      proxy-metrics-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null && test -S /run/caddy-admin/admin.sock && test -S /run/caddy-security/control.sock"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      jellyfin.proxy.role: application

  caddy-socket-init:
    network_mode: none
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    user: "0:0"
    volumes:
      - caddy_admin_socket:/run/caddy-admin
      - caddy_security_control:/run/caddy-security
    command: ["sh", "-c", "chown 0:65532 /run/caddy-admin && chmod 2750 /run/caddy-admin && chown 1000:1000 /run/caddy-security && chmod 2770 /run/caddy-security"]

  security-state-init:
    network_mode: none
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    user: "0:0"
    volumes:
      - security_state:/state
      - fail2ban_state:/fail2ban
    command: ["sh", "-c", "chown 0:0 /state /fail2ban && chmod 0700 /state /fail2ban && touch /fail2ban/admin-events-disabled.log && chmod 0600 /fail2ban/admin-events-disabled.log"]

  security-events-init:
    network_mode: none
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    user: "0:0"
    volumes:
      - security_events:/events
    command: ["sh", "-c", "chown 65532:0 /events && chmod 2770 /events"]

  security-key-init:
    network_mode: none
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    user: "0:0"
    volumes:
      - security_event_key:/key
    command: ["sh", "-c", "if [ ! -f /key/event.key ]; then dd if=/dev/urandom of=/key/event.key bs=32 count=1 2>/dev/null && chown 0:65532 /key/event.key && chmod 0440 /key/event.key; fi"]

  security-control-init:
    network_mode: none
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    user: "0:0"
    volumes:
      - security_control:/run/jellyfin-proxy-security
    command: ["sh", "-c", "chown 0:65532 /run/jellyfin-proxy-security && chmod 2770 /run/jellyfin-proxy-security"]

  securityd:
    image: ${SECURITY_TEST_IMAGE:-jellyfin-proxy/security:integration-test}
    read_only: true
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    group_add:
      - "1000"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16777216
    depends_on:
      security-state-init:
        condition: service_completed_successfully
      security-events-init:
        condition: service_completed_successfully
      security-key-init:
        condition: service_completed_successfully
      security-control-init:
        condition: service_completed_successfully
      caddy-socket-init:
        condition: service_completed_successfully
    volumes:
      - security_state:/var/lib/jellyfin-proxy/security
      - fail2ban_state:/var/lib/fail2ban
      - security_events:/var/lib/jellyfin-proxy/security-events
      - security_event_key:/run/jellyfin-proxy-security/key:ro
      - security_control:/run/jellyfin-proxy-security
      - caddy_security_control:/run/caddy-security
    networks:
      default:
        ipv4_address: ${SECURITYD_IP:-172.29.254.40}
    command:
      - --state
      - /var/lib/jellyfin-proxy/security/state.json
      - --events
      - /var/lib/jellyfin-proxy/security-events
      - --event-key
      - /run/jellyfin-proxy-security/key/event.key
      - --control-socket
      - /run/jellyfin-proxy-security/control.sock
      - --caddy-socket
      - /run/caddy-security/control.sock
      - --journal-cursor
      - /var/lib/jellyfin-proxy/security/ssh.cursor
      - --journalctl
      - /usr/local/bin/fake-journalctl
    healthcheck:
      test: ["CMD", "/usr/local/bin/securityd", "--healthcheck", "--control-socket", "/run/jellyfin-proxy-security/control.sock"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  proxy-metrics-init:
    network_mode: none
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    user: "0:0"
    volumes:
      - proxy_metrics:/run/proxy-metrics
    command: ["sh", "-c", "mkdir -p /run/proxy-metrics && chown 1000:1000 /run/proxy-metrics && chmod 0755 /run/proxy-metrics"]

  admin:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile.admin
      args:
        VERSION: integration-test
        BUILD_NUMBER: browser-test
    command: ["--listen", ":8080", "--config", "/opt/jellyfin-proxy/config/admin.json", "--totp-key", "/opt/jellyfin-proxy/config/totp-key/totp.key", "--totp-state", "/opt/jellyfin-proxy/data/totp-state.json", "--whitelist", "/opt/jellyfin-proxy/data/whitelist.json", "--caddy-socket", "/run/caddy-admin/admin.sock", "--caddyfile", "/etc/caddy/Caddyfile", "--wireguard-client-config", "/opt/jellyfin-proxy/data/wireguard-client/windows.conf", "--wireguard-control-socket", "/run/wireguard-control/control.sock", "--wireguard-endpoint", "wireguard:51820", "--wireguard-health", "/run/wireguard-health/current", "--host-metrics-url", "http://hostmetrics:8181", "--container-health-url", "http://containerhealth:8282", "--proxy-metrics", "/run/proxy-metrics/current.json", "--security-events", "/opt/jellyfin-proxy/data/security-events", "--security-event-key", "/opt/jellyfin-proxy/config/security-event-key/event.key", "--security-control-socket", "/run/jellyfin-proxy-security/control.sock", "--trusted-proxy-cidrs", "${WIREGUARD_IP:-172.29.254.2}/32"]
    volumes:
      - ./admin-credential.generated.json:/opt/jellyfin-proxy/config/admin.json:ro
      - totp_key:/opt/jellyfin-proxy/config/totp-key:ro
      - wireguard_client:/opt/jellyfin-proxy/data/wireguard-client:rw
      - wireguard_control:/run/wireguard-control
      - caddy_admin_socket:/run/caddy-admin
      - proxy_metrics:/run/proxy-metrics:ro
      - wireguard_health:/run/wireguard-health:ro
      - security_events:/opt/jellyfin-proxy/data/security-events
      - security_event_key:/opt/jellyfin-proxy/config/security-event-key:ro
      - security_control:/run/jellyfin-proxy-security
      - admin_data:/opt/jellyfin-proxy/data
      - ../../deploy/caddy/Caddyfile.test:/etc/caddy/Caddyfile:ro
    group_add:
      - "65532"
    expose:
      - "8080"
    networks:
      default:
        ipv4_address: ${ADMIN_IP:-172.29.254.50}
        aliases:
          - admin-origin
      observer: {}
    labels:
      jellyfin.proxy.role: application
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      caddy:
        condition: service_started
      hostmetrics:
        condition: service_started
      containerhealth:
        condition: service_healthy
      admin-data-init:
        condition: service_completed_successfully
      totp-state-init:
        condition: service_completed_successfully
      totp-key-init:
        condition: service_completed_successfully
      securityd:
        condition: service_started
      security-state-init:
        condition: service_completed_successfully
      security-events-init:
        condition: service_completed_successfully
      security-key-init:
        condition: service_completed_successfully
      security-control-init:
        condition: service_completed_successfully
      wireguard-config-init:
        condition: service_completed_successfully

  browser-tests:
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
    profiles: [browser-tests]
    working_dir: /tmp
    volumes:
      - ./browser:/tests:rw
    environment:
      BASE_URL: https://admin.domain.test
      SECURITY_TEST_BAN_IP: ${UNTRUSTED_CLIENT_IP:-172.29.254.20}
      SECURITY_TEST_CLIENT_IP: ${BROWSER_TEST_IP:-172.29.254.30}
    command: ["bash", "-lc", "cp -a /tests /tmp/totp-browser && cd /tmp/totp-browser && npm install --global --ignore-scripts --no-audit --no-fund npm@12.2.0 && npm ci && npx playwright test --reporter=line --update-snapshots=${BROWSER_SNAPSHOT_MODE:-missing}; status=$$?; cp -a /tmp/totp-browser/*-snapshots /tests/ 2>/dev/null || true; exit $$status"]
    depends_on:
      admin:
        condition: service_started
    networks:
      default:
        ipv4_address: ${BROWSER_TEST_IP:-172.29.254.30}

  admin-data-init:
    network_mode: none
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    user: "0:0"
    volumes:
      - admin_data:/data
    command: ["sh", "-c", "chown 65532:65532 /data && chmod 700 /data"]

  totp-state-init:
    network_mode: none
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    user: "0:0"
    volumes:
      - admin_data:/data
    depends_on:
      admin-data-init:
        condition: service_completed_successfully
    command: ["sh", "-c", "if [ ! -f /data/totp-state.json ]; then printf '{\"version\":1,\"status\":\"unconfigured\"}\\n' > /data/totp-state.json && chown 65532:65532 /data/totp-state.json && chmod 600 /data/totp-state.json; fi"]

  trusted-client:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 600"]
    networks:
      default:
        ipv4_address: ${TRUSTED_CLIENT_IP:-172.29.254.10}

  untrusted-client:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 600"]
    networks:
      default:
        ipv4_address: ${UNTRUSTED_CLIENT_IP:-172.29.254.20}

volumes:
  wireguard_server:
  wireguard_client:
  wireguard_control:
  caddy_data:
  caddy_config:
  caddy_admin_socket:
  admin_data:
  totp_key:
  proxy_metrics:
  wireguard_health:
  security_state:
  fail2ban_state:
  security_events:
  security_event_key:
  security_control:
  caddy_security_control:

networks:
  default:
    ipam:
      config:
        - subnet: ${TEST_SUBNET:-172.29.254.0/24}
  observer:
    internal: true
