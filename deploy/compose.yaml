services:
  hostmetrics:
    image: "jellyfin-proxy/hostmetrics:${RELEASE_VERSION:-1.0.0-dev}"
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
      - type: bind
        source: /
        target: /host/root
        read_only: true
    expose:
      - "8181"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8181/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  wireguard:
    image: "jellyfin-proxy/wireguard:${RELEASE_VERSION:-1.0.0-dev}"
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "${WIREGUARD_PORT:-51820}:51820/udp"
    volumes:
      - ./config/wireguard/server.conf:/etc/wireguard/wg0.conf:ro
    restart: unless-stopped

  caddy:
    image: "jellyfin-proxy/caddy:${RELEASE_VERSION:-1.0.0-dev}"
    network_mode: service:wireguard
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-example.invalid}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/whitelist.caddy:/etc/caddy/whitelist.caddy:ro
      - ./site:/srv/site:ro
      - caddy_admin_socket:/run/caddy-admin
      - caddy_data:/data
      - caddy_config:/config
      - proxy_metrics:/run/proxy-metrics
    depends_on:
      wireguard:
        condition: service_healthy
      caddy-socket-init:
        condition: service_completed_successfully
      proxy-metrics-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "caddy validate --config /etc/caddy/Caddyfile && test -S /run/caddy-admin/admin.sock"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  caddy-socket-init:
    image: alpine:3.22
    user: "0:0"
    volumes:
      - caddy_admin_socket:/run/caddy-admin
    command: ["sh", "-c", "chown 0:65532 /run/caddy-admin && chmod 2750 /run/caddy-admin"]

  proxy-metrics-init:
    image: alpine:3.22
    user: "0:0"
    volumes:
      - proxy_metrics:/run/proxy-metrics
    command: ["sh", "-c", "mkdir -p /run/proxy-metrics && chown 1000:1000 /run/proxy-metrics && chmod 0755 /run/proxy-metrics"]

  admin:
    image: "jellyfin-proxy/admin:${RELEASE_VERSION:-1.0.0-dev}"
    command:
      - --listen
      - :8080
      - --config
      - /opt/jellyfin-proxy/config/admin.json
      - --totp-key
      - /opt/jellyfin-proxy/config/totp.key
      - --totp-state
      - /opt/jellyfin-proxy/data/totp-state.json
      - --whitelist
      - /opt/jellyfin-proxy/data/whitelist.json
      - --caddy-socket
      - /run/caddy-admin/admin.sock
      - --caddyfile
      - /etc/caddy/Caddyfile
      - --wireguard-client-config
      - /opt/jellyfin-proxy/config/wireguard/windows.conf
      - --host-metrics-url
      - http://hostmetrics:8181
      - --proxy-metrics
      - /run/proxy-metrics/current.json
    volumes:
      - ./config/admin.json:/opt/jellyfin-proxy/config/admin.json:ro
      - ./config/totp.key:/opt/jellyfin-proxy/config/totp.key:ro
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/wireguard:/opt/jellyfin-proxy/config/wireguard:ro
      - ./data:/opt/jellyfin-proxy/data
      - caddy_admin_socket:/run/caddy-admin
      - proxy_metrics:/run/proxy-metrics:ro
    group_add:
      - "65532"
    expose:
      - "8080"
    depends_on:
      caddy:
        condition: service_healthy
      hostmetrics:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  caddy_admin_socket:
  caddy_data:
  caddy_config:
  proxy_metrics:
