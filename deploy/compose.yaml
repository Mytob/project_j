services:
  hostmetrics:
    image: "jellyfin-proxy/hostmetrics:${RELEASE_VERSION:-1.0.0-dev}"
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
      - type: bind
        source: /
        target: /host/root
        read_only: true
    expose:
      - "8181"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8181/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    labels:
      jellyfin.proxy.role: application

  containerhealth:
    image: "jellyfin-proxy/containerhealth:${RELEASE_VERSION:-1.0.0-dev}"
    read_only: true
    user: "0:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    expose:
      - "8282"
    networks:
      - admin_observer
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8282/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  wireguard:
    image: "jellyfin-proxy/wireguard:${RELEASE_VERSION:-1.0.0-dev}"
    cap_add:
      - NET_ADMIN
    environment:
      WIREGUARD_CONFIG: /etc/wireguard/server.conf
      WIREGUARD_INTERFACE: server
      WIREGUARD_CLIENT_CONFIG: /var/lib/wireguard-client/windows.conf
      WIREGUARD_CONTROL_SOCKET: /run/wireguard-control/control.sock
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "${WIREGUARD_PORT:-51820}:51820/udp"
    volumes:
      - ./config/wireguard:/etc/wireguard:rw
      - ./data/wireguard-client:/var/lib/wireguard-client:rw
      - wireguard_control:/run/wireguard-control
      - wireguard_health:/run/wireguard-health
    restart: unless-stopped
    labels:
      jellyfin.proxy.role: application

  caddy:
    image: "jellyfin-proxy/caddy:${RELEASE_VERSION:-1.0.0-dev}"
    network_mode: service:wireguard
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-example.invalid}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/whitelist.caddy:/etc/caddy/whitelist.caddy:ro
      - ./site:/srv/site:ro
      - caddy_admin_socket:/run/caddy-admin
      - caddy_data:/data
      - caddy_config:/config
      - proxy_metrics:/run/proxy-metrics
    depends_on:
      wireguard:
        condition: service_healthy
      caddy-socket-init:
        condition: service_completed_successfully
      proxy-metrics-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "caddy validate --config /etc/caddy/Caddyfile && test -S /run/caddy-admin/admin.sock"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    labels:
      jellyfin.proxy.role: application

  caddy-socket-init:
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    user: "0:0"
    volumes:
      - caddy_admin_socket:/run/caddy-admin
    command: ["sh", "-c", "chown 0:65532 /run/caddy-admin && chmod 2750 /run/caddy-admin"]

  proxy-metrics-init:
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    user: "0:0"
    volumes:
      - proxy_metrics:/run/proxy-metrics
    command: ["sh", "-c", "mkdir -p /run/proxy-metrics && chown 1000:1000 /run/proxy-metrics && chmod 0755 /run/proxy-metrics"]

  admin:
    image: "jellyfin-proxy/admin:${RELEASE_VERSION:-1.0.0-dev}"
    command:
      - --listen
      - :8080
      - --config
      - /opt/jellyfin-proxy/config/admin.json
      - --totp-key
      - /opt/jellyfin-proxy/config/totp.key
      - --totp-state
      - /opt/jellyfin-proxy/data/totp-state.json
      - --whitelist
      - /opt/jellyfin-proxy/data/whitelist.json
      - --caddy-socket
      - /run/caddy-admin/admin.sock
      - --caddyfile
      - /etc/caddy/Caddyfile
      - --wireguard-client-config
      - /opt/jellyfin-proxy/data/wireguard-client/windows.conf
      - --wireguard-control-socket
      - /run/wireguard-control/control.sock
      - --wireguard-health
      - /run/wireguard-health/current
      - --host-metrics-url
      - http://hostmetrics:8181
      - --container-health-url
      - http://containerhealth:8282
      - --proxy-metrics
      - /run/proxy-metrics/current.json
    volumes:
      - ./config/admin.json:/opt/jellyfin-proxy/config/admin.json:ro
      - ./config/totp.key:/opt/jellyfin-proxy/config/totp.key:ro
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/opt/jellyfin-proxy/data
      - wireguard_control:/run/wireguard-control
      - caddy_admin_socket:/run/caddy-admin
      - proxy_metrics:/run/proxy-metrics:ro
      - wireguard_health:/run/wireguard-health:ro
    group_add:
      - "65532"
    expose:
      - "8080"
    depends_on:
      caddy:
        condition: service_healthy
      hostmetrics:
        condition: service_started
      containerhealth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    labels:
      jellyfin.proxy.role: application
    networks:
      - default
      - admin_observer
    environment:
      WIREGUARD_ENDPOINT: "${BASE_DOMAIN:-example.invalid}:${WIREGUARD_PORT:-51820}"

volumes:
  caddy_admin_socket:
  caddy_data:
  caddy_config:
  proxy_metrics:
  wireguard_health:
  wireguard_control:

networks:
  admin_observer:
    internal: true
